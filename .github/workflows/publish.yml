name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tool
        run: python -m pip install -e ".[test]" build twine

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(python -c 'import pdf_mcp; print(pdf_mcp.__version__)')" = "$GITHUB_REF_NAME"

      - name: Run tests and launch checks
        run: |
          python -m unittest discover -s tests
          python scripts/validate_launch.py

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Prepare verified production deployment assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp PRODUCTION_DEPLOYMENT.md release-assets/
          cp requirements/smart-lab-production-constraints.txt release-assets/
          cp requirements/smart-lab-production-linux-x86_64-py312.lock release-assets/
          cp deploy/systemd/* release-assets/
          (cd dist && sha256sum * > ../release-assets/python-distributions-SHA256SUMS)

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload production deployment assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-deployment-assets
          path: release-assets/

  desktop-app:
    name: Desktop apps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install desktop build dependencies
        run: python -m pip install -e ".[desktop-build]"

      - name: Configure Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_BASE64)) {
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP "laboverlay-codesign.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          "SMART_LAB_WINDOWS_CERTIFICATE_PATH=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$SIGNING_IDENTITY" ]]; then
            exit 0
          fi
          certificate="$RUNNER_TEMP/laboverlay-codesign.p12"
          keychain="$RUNNER_TEMP/laboverlay-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          echo "SMART_LAB_MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "$NOTARY_APPLE_ID" && -n "$NOTARY_PASSWORD" && -n "$NOTARY_TEAM_ID" ]]; then
            xcrun notarytool store-credentials laboverlay-notary \
              --apple-id "$NOTARY_APPLE_ID" \
              --password "$NOTARY_PASSWORD" \
              --team-id "$NOTARY_TEAM_ID"
            echo "SMART_LAB_MACOS_NOTARY_PROFILE=laboverlay-notary" >> "$GITHUB_ENV"
          fi

      - name: Build and smoke-test desktop apps
        env:
          SMART_LAB_REQUIRE_SIGNING: ${{ vars.DESKTOP_SIGNING_REQUIRED }}
          SMART_LAB_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: |
          python scripts/build_desktop_app.py
          python scripts/build_smart_lab_desktop_app.py

      - name: Build and smoke-test Windows installer
        if: runner.os == 'Windows'
        env:
          SMART_LAB_REQUIRE_SIGNING: ${{ vars.DESKTOP_SIGNING_REQUIRED }}
          SMART_LAB_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE_PASSWORD }}
        run: python scripts/build_smart_lab_windows_installer.py

      - name: Upload desktop app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-app-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/pdf-mcp-app-*.zip
            dist/laboverlay-*.zip
            dist/laboverlay-*.zip.sha256
            dist/laboverlay-setup-*.exe
            dist/laboverlay-setup-*.exe.sha256

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, desktop-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-distributions"
          path: release/
          merge-multiple: true

      - name: Download desktop apps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-app-*
          path: release/
          merge-multiple: true

      - name: Download production deployment assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-deployment-assets
          path: release/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "pdf-mcp $GITHUB_REF_NAME"

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server metadata
        run: ./mcp-publisher publish
