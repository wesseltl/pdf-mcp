[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-agent-mcp"
version = "0.7.0"
description = "Local-first laboratory knowledge indexing with compatible PDF and Word ingestion tools."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Wessel ter Laak" }]
keywords = ["laboratory", "knowledge-index", "local-first", "provenance", "mcp", "pdf", "docx", "data-extraction"]
dependencies = [
  "pdfplumber>=0.11.10,<0.12",
  "python-docx>=1.2,<1.3",
  "openpyxl>=3.1.5,<3.2",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
cloud = ["fastmcp>=2.0", "httpx>=0.27"]
test = ["reportlab>=4", "httpx>=0.27"]
commerce = ["stripe>=15"]
desktop-build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/wesseltl/pdf-mcp"
Repository = "https://github.com/wesseltl/pdf-mcp"
"Landing page" = "https://wesseltl.github.io/pdf-mcp/"
"Paid pilot" = "https://github.com/wesseltl/pdf-mcp/blob/main/BUY.md"
"Free hosted beta" = "https://wesseltl.github.io/pdf-mcp/#free-beta"
"Agent offers" = "https://github.com/wesseltl/pdf-mcp/tree/main/offers"

[project.scripts]
smart-lab-index = "smart_lab_index.cli:main"
smart-lab-index-app = "smart_lab_index.web_app:main"
pdf-mcp-app = "pdf_mcp.web_app:main"
pdf-agent-mcp = "pdf_mcp.server:main"
pdf-agent-cloud-mcp = "pdf_mcp.cloud_server:main"
export-document-tables = "pdf_mcp.cli:main"
extract-document-with-profile = "pdf_mcp.profile_cli:extract_main"
evaluate-document-profile = "pdf_mcp.profile_cli:evaluate_main"

[tool.setuptools.packages.find]
include = ["pdf_mcp*", "smart_lab_index*"]

[tool.setuptools.package-data]
"pdf_mcp.profile_templates" = ["*.json"]
"pdf_mcp.web_ui" = ["*.html", "*.css", "*.js"]
"smart_lab_index.web_ui" = ["*.html", "*.css", "*.js"]
