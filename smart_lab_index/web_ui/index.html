<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="smart-lab-session" content="__SMART_LAB_SESSION__">
  <title>Smart Lab Index</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Application navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">SL</span>
        <span class="brand-name">Smart Lab Index</span>
      </div>
      <nav id="desktop-nav" class="desktop-nav" aria-label="Index views"></nav>
      <div class="sidebar-footer">
        <span class="sidebar-footer-label">Local application</span>
        <span id="product-version" class="product-version">Version —</span>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="source-context">
          <span class="context-label">Source</span>
          <strong id="source-root" class="source-root">Loading…</strong>
          <span id="egress-status" class="status-badge status-neutral">Checking policy</span>
        </div>
        <div class="topbar-actions">
          <button id="refresh-button" class="icon-button" type="button" title="Refresh data" aria-label="Refresh data">
            <span aria-hidden="true">↻</span>
          </button>
          <button id="index-button" class="button button-primary" type="button">
            <span aria-hidden="true">▶</span>
            <span>Index now</span>
          </button>
          <button id="shutdown-button" class="button button-danger-quiet" type="button">
            <span aria-hidden="true">■</span>
            <span>Stop app</span>
          </button>
        </div>
      </header>

      <div class="mobile-navigation">
        <label for="mobile-view-select">View</label>
        <select id="mobile-view-select" aria-label="Current index view"></select>
      </div>

      <main id="main-content" class="main-content" tabindex="-1">
        <div class="view-toolbar">
          <div class="view-heading">
            <h1 id="view-title">Overview</h1>
            <span id="view-count" class="view-count" aria-live="polite"></span>
          </div>
          <div class="filter-control">
            <label class="visually-hidden" for="view-filter">Filter current view</label>
            <span class="filter-symbol" aria-hidden="true">⌕</span>
            <input id="view-filter" type="search" autocomplete="off" placeholder="Filter current view">
          </div>
        </div>

        <div id="announcement" class="visually-hidden" aria-live="polite"></div>
        <section id="operation-status" class="operation-region" aria-live="polite"></section>
        <div id="view-root" class="view-root" aria-busy="true">
          <div class="state-panel state-panel-loading" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <strong>Loading index</strong>
          </div>
        </div>
      </main>
    </div>
  </div>

  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title" aria-describedby="detail-subtitle">
    <div class="detail-header">
      <div>
        <h2 id="detail-title">Details</h2>
        <p id="detail-subtitle" class="detail-subtitle"></p>
      </div>
      <button id="detail-close" class="icon-button" type="button" title="Close details" aria-label="Close details">
        <span aria-hidden="true">×</span>
      </button>
    </div>
    <div id="detail-body" class="detail-body"></div>
  </dialog>
</body>
</html>
