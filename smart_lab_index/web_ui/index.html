<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="smart-lab-session" content="__SMART_LAB_SESSION__">
  <title>LabOverlay</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="app-shell">
    <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>
    <aside id="sidebar" class="sidebar" aria-label="Application navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">LO</span>
        <span class="brand-name">LabOverlay</span>
        <button id="mobile-menu-close" class="icon-button mobile-menu-close" type="button" title="Close navigation" aria-label="Close navigation">
          <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#x"></use></svg>
        </button>
      </div>
      <div class="sidebar-workspace">
        <span class="sidebar-workspace-label">Workspace</span>
        <strong id="sidebar-source-name">Opening workspace</strong>
        <span id="sidebar-source-state">Checking index status</span>
      </div>
      <nav id="desktop-nav" class="desktop-nav" aria-label="Index views"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-trust">
          <span class="sidebar-trust-marker" aria-hidden="true"></span>
          <span>
            <strong id="sidebar-trust-label">Private workspace</strong>
            <small id="sidebar-trust-detail">Local and read-only</small>
          </span>
        </div>
        <div class="sidebar-meta">
          <span id="product-version" class="product-version">Version —</span>
          <button id="shutdown-button" class="sidebar-close-action" type="button">
            <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#power"></use></svg>
            <span>Close application</span>
          </button>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button id="mobile-menu-button" class="icon-button mobile-menu-button" type="button" title="Open navigation" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#menu"></use></svg>
        </button>
        <div class="source-context">
          <span class="context-label">Workspace</span>
          <strong id="source-root" class="source-root">Loading…</strong>
        </div>
        <button id="global-search-button" class="global-search-button" type="button">
          <svg class="ui-icon global-search-icon" aria-hidden="true"><use href="/icons.svg#search"></use></svg>
          <span class="global-search-label">Search equipment, locations, people and documents</span>
          <kbd>/</kbd>
        </button>
        <div id="topbar-actions" class="topbar-actions">
          <button id="trust-button" class="trust-button" type="button">
            <span class="trust-indicator" aria-hidden="true"></span>
            <span id="egress-status">Checking trust status</span>
          </button>
          <button id="refresh-button" class="icon-button" type="button" title="Refresh data" aria-label="Refresh data">
            <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#refresh-cw"></use></svg>
          </button>
          <button id="change-source-button" class="button button-secondary" type="button" title="Choose another source folder" hidden>
            <span class="label-wide">Manage source</span>
            <span class="label-compact">Source</span>
          </button>
          <button id="index-button" class="button button-primary" type="button" title="Sync workspace" aria-label="Sync workspace now">
            <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#refresh-cw"></use></svg>
            <span class="label-wide">Sync now</span>
            <span class="label-compact">Sync</span>
          </button>
          <button id="cancel-index-button" class="button button-secondary" type="button" hidden>
            <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#x"></use></svg>
            <span class="label-wide">Cancel sync</span>
            <span class="label-compact">Cancel</span>
          </button>
        </div>
      </header>

      <main id="main-content" class="main-content" tabindex="-1">
        <div class="view-toolbar">
          <div class="view-heading">
            <span id="view-context" class="view-context">Workspace overview</span>
            <div class="view-title-row">
              <h1 id="view-title">Overview</h1>
              <span id="view-count" class="view-count" aria-live="polite"></span>
            </div>
          </div>
          <div id="filter-control" class="filter-control">
            <label id="view-filter-label" class="visually-hidden" for="view-filter">Filter current view</label>
            <span class="filter-symbol" aria-hidden="true">⌕</span>
            <input id="view-filter" type="search" autocomplete="off" placeholder="Filter current view">
          </div>
        </div>

        <div id="announcement" class="visually-hidden" aria-live="polite"></div>
        <section id="operation-status" class="operation-region" aria-live="polite"></section>
        <div id="view-root" class="view-root" aria-busy="true">
          <div class="state-panel state-panel-loading" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <strong>Loading index</strong>
          </div>
        </div>
      </main>
    </div>
  </div>

  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title" aria-describedby="detail-subtitle">
    <div class="detail-header">
      <div>
        <h2 id="detail-title">Details</h2>
        <p id="detail-subtitle" class="detail-subtitle"></p>
      </div>
      <button id="detail-close" class="icon-button" type="button" title="Close details" aria-label="Close details">
        <svg class="ui-icon" aria-hidden="true"><use href="/icons.svg#x"></use></svg>
      </button>
    </div>
    <div id="detail-body" class="detail-body"></div>
  </dialog>
</body>
</html>
